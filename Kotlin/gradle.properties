org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# The app's version for Android and Linux, read by androidApp (versionName /
# versionCode), desktopApp (packageVersion "<name>.<code>") and :shared
# (AppVersion, generated). Keep in step with iOS: MARKETING_VERSION and
# CURRENT_PROJECT_VERSION at the top of ../project.yml. Raise the build number
# before each release; release tags are v<name>.<code>, e.g. v1.0.6.
tetsubi.versionName=1.0
tetsubi.versionCode=10
